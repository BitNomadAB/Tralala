name: CI

# The suite is the contract: lint, types, unit tests, a production build and the user journeys.
# Every job runs from a clean checkout, so a green run here means what a local run means.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # 3.13 is the version of record: it is what the container image and the local virtual
    # environment run. The 3.14 leg keeps `requires-python` honest instead of promising an
    # interpreter nobody has tested.
    name: Backend (ruff + pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests migrations
      - name: Test
        run: python -m pytest

  frontend:
    name: Frontend (types, lint, unit tests, build, Markdown)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # Prettier first (.prettierrc.json): a file it would reformat fails the step. Then ESLint with
      # type information (eslint.config.js): every rule is an error and any warning fails.
      - name: Format and lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      # Includes `tsc --noEmit`, ESLint and the client build guard (no source maps, no server-only
      # strings), so the container image build cannot skip them either.
      - name: Production build
        run: pnpm build
      # The shipped documentation (README.md, AGENTS.md, docs/, public_docs/). markdownlint-cli2 is
      # a pinned dev dependency, so this is the same check `pnpm lint:md` runs locally.
      - name: Markdown lint
        run: pnpm lint:md

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The web tier is configuration (Caddyfile) plus a static build, and nothing in the unit tests
      # touches it: building the image is what proves the Caddyfile is valid and that the client
      # build guard can find its script inside the build context.
      - name: Build the web image
        run: docker build -t tralala-web:ci ./frontend
      - name: Serve the shell and the worker surface
        run: |
          docker run -d --name web -p 8080:80 -e TRALALA_BACKEND=backend:8000 tralala-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          # A deep client route answers with the shell, not with 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/boards/x/discussions)" = "200"
          # The security policy and the removed Server header are part of the contract.
          curl -sI http://127.0.0.1:8080/ | grep -qi "content-security-policy"
          ! curl -sI http://127.0.0.1:8080/ | grep -qi "^server:"
      - name: Build the backend image
        run: docker build -t tralala-backend:ci ./backend
      - name: Logs on failure
        if: failure()
        run: docker logs web || true

  e2e:
    name: Journeys (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        # The runner script reuses whichever Playwright it finds; installing here keeps the browser
        # and the client library on one version instead of downloading mid-test.
        run: npx --yes playwright install --with-deps chromium
      - name: Run the journeys
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: node ../scripts/run-playwright.mjs test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
