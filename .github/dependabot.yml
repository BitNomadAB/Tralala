# Weekly update pull requests for the three places dependencies are declared. Minor and patch
# updates arrive as one grouped pull request per ecosystem; a major update gets a pull request of
# its own, because it can change behaviour and needs its own review. Every pull request runs the
# whole CI workflow, the licence inventory and both audits included.
version: 2
updates:
  # backend/requirements.txt, requirements-dev.txt and pyproject.toml.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # frontend/package.json with its pnpm lockfile.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
