services:
  backend:
    build:
      context: ./backend
    environment:
      TRALALA_DATA_DIR: /data
      TRALALA_SECRET_KEY: ${TRALALA_SECRET_KEY:?set TRALALA_SECRET_KEY in .env}
      TRALALA_BOOTSTRAP_USERNAME: ${TRALALA_BOOTSTRAP_USERNAME:-admin}
      TRALALA_BOOTSTRAP_PASSWORD: ${TRALALA_BOOTSTRAP_PASSWORD:?set TRALALA_BOOTSTRAP_PASSWORD in .env}
      TRALALA_COOKIE_SECURE: ${TRALALA_COOKIE_SECURE:-false}
      # Caddy is the only thing that talks to the backend, so trusting its X-Forwarded-For is what
      # keeps the sign-in throttle keyed on the real client instead of on the proxy.
      TRALALA_TRUST_PROXY_HEADERS: ${TRALALA_TRUST_PROXY_HEADERS:-true}
      TRALALA_CORS_ORIGINS: ""
      TRALALA_RATE_LIMIT_PER_MINUTE: ${TRALALA_RATE_LIMIT_PER_MINUTE:-600}
      TRALALA_ENABLE_DOCS: ${TRALALA_ENABLE_DOCS:-true}
      TRALALA_DOCS_REQUIRE_AUTH: ${TRALALA_DOCS_REQUIRE_AUTH:-true}
      TRALALA_LOG_LEVEL: ${TRALALA_LOG_LEVEL:-INFO}
    volumes:
      - tralala-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      # `:80` serves plain HTTP (behind Tailscale Serve or another TLS terminator). A hostname makes
      # Caddy obtain a certificate itself: a public CA for a public name, its local CA otherwise.
      TRALALA_SITE_ADDRESS: ${TRALALA_SITE_ADDRESS:-:80}
      TRALALA_BACKEND: backend:8000
    ports:
      - "${TRALALA_HTTP_PORT:-8080}:80"
      # Only used when TRALALA_SITE_ADDRESS is an HTTPS address.
      - "${TRALALA_HTTPS_PORT:-8443}:443"
    volumes:
      # Certificates and ACME state must survive a restart, or every deploy re-issues them.
      - tralala-caddy-data:/data
      - tralala-caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tralala-data:
  tralala-caddy-data:
  tralala-caddy-config:
